
<style>
    html { height: 100%; width: 100%; }
    /* Use 100dvh to handle mobile browser address bars correctly */
    body { 
        height: 100dvh; 
        width: 100%; 
        margin: 0; 
        padding: 0; 
        font-family: 'Inter', 'Sarabun', sans-serif; 
        -webkit-font-smoothing: antialiased;
        overflow: hidden; /* Prevent body scroll, handle inside containers */
    }
    
    /* Safe Area Utilities for iPhone X+ */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
    
    /* Utility to hide scrollbar explicitly */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }

    /* Modern Custom Scrollbar Styling (Global) */
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }
    
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(203, 213, 225, 0.5); /* Slate-300 transparent */
        border-radius: 9999px;
        transition: background-color 0.2s;
    }
    
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(148, 163, 184, 0.8);
    }
    
    /* Animations */
    .animate-enter { animation: enter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes enter {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .animate-bounce-in { animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes bounceIn {
        0% { opacity: 0; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
    }

    .animate-toast-slide { animation: toastSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes toastSlide {
        0% { opacity: 0; transform: translateX(20px); }
        100% { opacity: 1; transform: translateX(0); }
    }

    /* 🟢 NEW: Staggered Fade In Up for Table Rows */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .stagger-appear tr, .stagger-appear .card-item {
        animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
    }
    
    /* Create delay loop for first 20 items */
    .stagger-appear tr:nth-child(1), .stagger-appear .card-item:nth-child(1) { animation-delay: 0.05s; }
    .stagger-appear tr:nth-child(2), .stagger-appear .card-item:nth-child(2) { animation-delay: 0.1s; }
    .stagger-appear tr:nth-child(3), .stagger-appear .card-item:nth-child(3) { animation-delay: 0.15s; }
    .stagger-appear tr:nth-child(4), .stagger-appear .card-item:nth-child(4) { animation-delay: 0.2s; }
    .stagger-appear tr:nth-child(5), .stagger-appear .card-item:nth-child(5) { animation-delay: 0.25s; }
    .stagger-appear tr:nth-child(6), .stagger-appear .card-item:nth-child(6) { animation-delay: 0.3s; }
    .stagger-appear tr:nth-child(7), .stagger-appear .card-item:nth-child(7) { animation-delay: 0.35s; }
    .stagger-appear tr:nth-child(8), .stagger-appear .card-item:nth-child(8) { animation-delay: 0.4s; }
    .stagger-appear tr:nth-child(9), .stagger-appear .card-item:nth-child(9) { animation-delay: 0.45s; }
    .stagger-appear tr:nth-child(10), .stagger-appear .card-item:nth-child(10) { animation-delay: 0.5s; }
    /* ...and so on, usually 10-15 is enough to feel premium */

    
    /* Gradient Utilities — warm banner (60/30/10 theme) */
    .bg-banner-gradient {
        background:
            radial-gradient(120% 140% at 88% -10%, rgba(255,158,32,0.40) 0%, rgba(255,158,32,0) 55%),
            linear-gradient(135deg, #CDE3E3 0%, #F4F2F2 55%, #FFFFFF 100%);
    }

    /* Skeleton Shimmer Effect (warm light) */
    .skeleton-shimmer {
        background: #E7E4E4;
        background-image: linear-gradient(
            to right,
            #E7E4E4 0%,
            #F2F0F0 20%,
            #E7E4E4 40%,
            #E7E4E4 100%
        );
        background-repeat: no-repeat;
        background-size: 800px 100%;
        animation: shimmer 1.5s infinite linear forwards;
    }

    @keyframes shimmer {
        0% { background-position: -800px 0; }
        100% { background-position: 800px 0; }
    }

    /* ==========================================================================
       THEME — Clean teal · base #F4F2F2 / cards #FFFFFF / accent teal #215E61 / pop orange #FF9E20 / charcoal text
       Overrides the Tailwind neutrals app-wide with !important so it wins over the
       Tailwind CDN utilities without touching every inline class.
       Semantic status hues (emerald/rose/amber/etc.) are intentionally left as-is.
       ========================================================================== */
    :root {
        --bg:        #F4F2F2;   /* 60% — page base (off-white)  */
        --surface:   #FFFFFF;   /* 30% — cards (white, lifted)  */
        --surface-2: #E7E4E4;   /* hover, headers, tracks (soft gray) */
        --recessed:  #EDEBEB;   /* inputs, inner chips (light)  */
        --elevated:  #1D2128;   /* charcoal bars — white text   */
        --accent:    #215E61;   /* 10% — primary / active (teal) */
        --accent-2:  #FF9E20;   /* orange pop: badges, glow, selection */
        --accent-ink:#ffffff;   /* white text on teal accent    */
        --line:      rgba(29,33,40,0.14);
        --line-strong: rgba(29,33,40,0.22);
        --tx-900: #1D2128;
        --tx-800: #2b3038;
        --tx-700: #3d434d;
        --tx-600: #545b66;
        --tx-500: #6e7681;
        --tx-400: #8b929c;
        --tx-300: #adb3bb;
    }

    html, body { background-color: var(--bg); color: var(--tx-800); color-scheme: light; }
    ::selection { background: rgba(255,158,32,0.40); }
    input, select, textarea { color: inherit; }

    /* --- base / page surfaces (the old peachy bg) → cream --- */
    .bg-\[\#FFF8F6\], .bg-\[\#FDF4F0\] { background-color: var(--bg) !important; }

    /* --- card surfaces --- */
    .bg-white,
    .bg-white\/95, .bg-white\/90 { background-color: var(--surface) !important; }
    .bg-white\/50, .bg-white\/40, .bg-white\/30, .bg-white\/20 { background-color: rgba(255,255,255,0.5) !important; }

    /* --- recessed inner surfaces (inputs, metric chips) --- */
    .bg-slate-50,
    .bg-slate-50\/50, .bg-slate-50\/70, .bg-slate-50\/80 { background-color: var(--recessed) !important; }

    /* --- 30% peach: hover / tracks / lifted --- */
    .bg-slate-100 { background-color: var(--surface-2) !important; }
    .bg-slate-200 { background-color: var(--line-strong) !important; }
    .bg-slate-300 { background-color: rgba(29,33,40,0.18) !important; }

    /* --- former dark (slate-900/800) elements stay dark & keep white text --- */
    .bg-slate-900 { background-color: var(--elevated) !important; }
    .bg-slate-800 { background-color: #2b3038 !important; }

    /* --- hover states --- */
    .hover\:bg-white:hover { background-color: #ffffff !important; }
    .hover\:bg-slate-50:hover,
    .hover\:bg-slate-50\/50:hover,
    .hover\:bg-slate-50\/80:hover { background-color: rgba(29,33,40,0.05) !important; }
    .hover\:bg-slate-100:hover { background-color: #DED9D9 !important; }
    .hover\:bg-slate-800:hover { background-color: #12151a !important; }
    .group:hover .group-hover\:bg-slate-50 { background-color: rgba(255,255,255,0.10) !important; }

    /* --- text tints (dark warm on light) --- */
    .text-slate-900 { color: var(--tx-900) !important; }
    .text-slate-800 { color: var(--tx-800) !important; }
    .text-slate-700 { color: var(--tx-700) !important; }
    .text-slate-600 { color: var(--tx-600) !important; }
    .text-slate-500 { color: var(--tx-500) !important; }
    .text-slate-400 { color: var(--tx-400) !important; }
    .text-slate-300 { color: var(--tx-300) !important; }
    .placeholder\:text-slate-400::placeholder { color: var(--tx-400) !important; }

    /* --- borders → warm hairline --- */
    .border-slate-50, .border-slate-100 { border-color: var(--line) !important; }
    .border-slate-200, .border-slate-300 { border-color: var(--line-strong) !important; }

    /* scrollbar thumb */
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(29,33,40,0.25); }
</style>
